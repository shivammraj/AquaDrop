<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background glow / water aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72D6FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38B6FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38B6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Main 3D Droplet Gradient -->
    <linearGradient id="bodyGrad" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0%" stop-color="#80E0FF"/>
      <stop offset="25%" stop-color="#46C2FF"/>
      <stop offset="65%" stop-color="#1B88F5"/>
      <stop offset="100%" stop-color="#0B63D6"/>
    </linearGradient>

    <!-- Inner Caustic / Ambient Glow -->
    <radialGradient id="causticGlow" cx="45%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#C5F3FF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#6BD5FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1B88F5" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Highlight Soft Reflection -->
    <linearGradient id="topReflect" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Bubble Gradient -->
    <radialGradient id="bubbleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#A8ECFF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#38B6FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B63D6" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0D54B8" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="100" cy="115" r="82" fill="url(#auraGlow)"/>

  <!-- Surrounding Bubbles -->
  <!-- Top Left Bubble -->
  <g filter="drop-shadow(0 4px 6px rgba(11,99,214,0.25))">
    <circle cx="34" cy="62" r="14" fill="url(#bubbleGrad)"/>
    <ellipse cx="30" cy="56" rx="4.5" ry="2.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 30 56)"/>
  </g>
  <!-- Tiny Top Bubble -->
  <circle cx="52" cy="38" r="6" fill="url(#bubbleGrad)"/>
  <ellipse cx="50" cy="36" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.9"/>

  <!-- Right Floating Bubble -->
  <g filter="drop-shadow(0 4px 6px rgba(11,99,214,0.25))">
    <circle cx="166" cy="74" r="11" fill="url(#bubbleGrad)"/>
    <ellipse cx="163" cy="70" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.85" transform="rotate(-20 163 70)"/>
  </g>
  <circle cx="178" cy="98" r="5" fill="url(#bubbleGrad)"/>

  <!-- Left Lower Bubble -->
  <circle cx="28" cy="118" r="7.5" fill="url(#bubbleGrad)"/>
  <ellipse cx="26" cy="115" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- MAIN DROPLET BODY with Shadow -->
  <g filter="url(#softShadow)">
    <path d="M100 24
             C106 36, 126 72, 142 98
             C158 124, 158 152, 140 172
             C122 192, 78 192, 60 172
             C42 152, 42 124, 58 98
             C74 72, 94 36, 100 24 Z"
          fill="url(#bodyGrad)"/>
  </g>

  <!-- Bottom Translucent Caustic Glow -->
  <ellipse cx="100" cy="154" rx="42" ry="24" fill="url(#causticGlow)"/>

  <!-- Left-Edge Rim Light -->
  <path d="M60 102
           C46 126, 48 150, 62 168
           C54 154, 54 128, 66 108 Z"
        fill="#FFFFFF" opacity="0.32"/>

  <!-- Top-Left Glossy Specular Highlight -->
  <path d="M96 36
           C86 52, 66 84, 60 114
           C58 100, 68 68, 92 40 Z"
        fill="url(#topReflect)"/>

  <ellipse cx="80" cy="62" rx="7" ry="18"
           fill="#FFFFFF" opacity="0.65"
           transform="rotate(-28 80 62)"/>

  <ellipse cx="73" cy="88" rx="4" ry="7"
           fill="#FFFFFF" opacity="0.5"
           transform="rotate(-20 73 88)"/>

  <!-- KAWAII FACE -->
  <!-- Left Eye -->
  <g>
    <ellipse cx="82" cy="124" rx="6.5" ry="9" fill="#0A2246"/>
    <!-- Catchlight primary -->
    <circle cx="80" cy="120" r="3.2" fill="#FFFFFF"/>
    <!-- Catchlight secondary -->
    <circle cx="84.5" cy="127" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Right Eye -->
  <g>
    <ellipse cx="118" cy="124" rx="6.5" ry="9" fill="#0A2246"/>
    <!-- Catchlight primary -->
    <circle cx="116" cy="120" r="3.2" fill="#FFFFFF"/>
    <!-- Catchlight secondary -->
    <circle cx="120.5" cy="127" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Cheeks (Blush) -->
  <ellipse cx="70" cy="133" rx="7.5" ry="4" fill="#FF6B9D" opacity="0.55"/>
  <ellipse cx="130" cy="133" rx="7.5" ry="4" fill="#FF6B9D" opacity="0.55"/>

  <!-- Smiling Mouth -->
  <path d="M94 135 C96 143, 104 143, 106 135"
        stroke="#0A2246" stroke-width="3" stroke-linecap="round" fill="#F85C7F"/>
</svg>
