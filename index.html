<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drink Water — Reminder &amp; Hydration Tracker</title>
    <meta name="description" content="A simple, thoughtful water reminder and daily hydration tracker." />
    <meta name="keywords" content="drink water, water reminder, hydration tracker, drink water reminder" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Prevent theme flash: apply stored theme before React renders -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('aquadrop.state.v1')
          var theme = 'system'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark' || parsed.theme === 'system')) {
              theme = parsed.theme
            }
          }
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'system'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
