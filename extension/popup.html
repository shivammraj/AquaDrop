<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AquaDrop</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 12px; width: 320px; }
      .btn { display:inline-block; padding:8px 12px; border-radius:10px; border:1px solid #DCE8F7; background:#FFFFFF; cursor:pointer }
      .primary { background:#1677FF; color:white; border-color:transparent }
      .row { display:flex; gap:8px; align-items:center; margin-top:8px }
    </style>
  </head>
  <body>
    <h3>AquaDrop</h3>
    <div id="status">Loading…</div>
    <div class="row">
      <button id="start" class="btn primary">Start</button>
      <button id="pause" class="btn">Pause</button>
    </div>

    <div style="margin-top:12px">
      <label for="interval">Interval</label>
      <div class="row">
        <select id="intervalUnit">
          <option value="minutes">minutes</option>
          <option value="hours">hours</option>
        </select>
        <input id="intervalValue" type="number" min="1" value="30" style="width:80px" />
        <button id="setInterval" class="btn">Set</button>
      </div>
    </div>

    <div style="margin-top:12px" class="row">
      <button id="snooze" class="btn">Snooze</button>
      <button id="log" class="btn">I've drunk water</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
